# ============================================
# Django Blog — Docker Compose
# ============================================
# Setup:
#   cp .env.example .env     (then edit .env)
#
# Usage:
#   Start the stack:          docker compose up --build
#   With the dev mail server: docker compose --profile dev up --build
# ============================================

services:
  # ── PostgreSQL Database ──────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: django_blog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGDB_PASS:?Set PGDB_PASS in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published on the host loopback only
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Application ───────────────────
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn CoreFolder.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These values are tied to the db service above and override .env
      DJANGO_SETTINGS_MODULE: CoreFolder.settings.production
      PGDB_HOST: db
      PGDB_NAME: django_blog
      PGDB_USER: postgres
    depends_on:
      db:
        condition: service_healthy

  # ── smtp4dev (Development email server) ──
  mailserver:
    image: rnwood/smtp4dev:v3
    restart: unless-stopped
    ports:
      - "5000:80" # Web UI
      - "25:25" # SMTP
    profiles:
      - dev

volumes:
  postgres_data:
  static_volume:
  media_volume:
